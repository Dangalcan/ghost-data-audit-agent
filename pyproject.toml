[project]
name = "ghost-data-audit"
version = "1.0.0"
description = "Deletion-audit agent for HackerRank Orchestrate (October 2026) - Ghost Data Still Exists"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PL"]
ignore = [
    "PLR0913",  # many arguments on a few parser entry points
    "PLR2004",  # magic numbers in parsers are documented inline
    "E501",     # handled by the formatter
    "SIM108",   # explicit if/else reads better in the parsers
    "PLC0415",  # lazy imports: optional model dependencies and import-cycle avoidance
    "PLR0917",  # positional parameters on the observation constructors
]

[tool.ruff.lint.pylint]
max-branches = 14
max-statements = 60
max-returns = 8

[tool.ruff.lint.isort]
known-first-party = ["audit", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
addopts = "-q"
